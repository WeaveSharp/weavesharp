name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  # Superseded pull request runs stop; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks, verified against its published SHA-256
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --proto '=https' --retry 3 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Refuse scanner settings a change could supply
        # gitleaks reads .gitleaks.toml and .gitleaksignore from the scanned tree and skips any
        # line marked with its inline allow comment, so a change could allowlist its own secret.
        # None may exist, and no commit in the history may add or remove an allow comment.
        run: |
          found="$(git ls-files -- '.gitleaks.toml' '**/.gitleaks.toml' '.gitleaksignore' '**/.gitleaksignore')"
          if [ -n "$found" ]; then
            echo "::error::gitleaks settings are not allowed in the repository: $found"
            exit 1
          fi
          marked="$(git log --format=%h -G 'gitleaks:allo[w]' HEAD)"
          if [ -n "$marked" ]; then
            echo "::error::commits add or remove a gitleaks inline allow comment: $marked"
            exit 1
          fi

      - name: Scan the full history
        # The built-in rules only, with no ignore file from the checkout.
        run: |
          mkdir -p "$RUNNER_TEMP/no-ignores"
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --gitleaks-ignore-path "$RUNNER_TEMP/no-ignores" .
