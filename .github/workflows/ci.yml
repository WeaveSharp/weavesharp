name: ci

# Pull requests build and test on Linux and Windows; main, the weekly run and
# manual runs add macOS. Every job always runs and decides inside what to
# build, so no required check is ever skipped.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# No usage data leaves CI from the .NET command line or the test platform.
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull request runs stop; every commit on main keeps its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04","windows-2025"]' || '["ubuntu-24.04","windows-2025","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow action pins
        if: runner.os == 'Linux'
        run: python3 .github/scripts/check-actions.py

      - name: Check supply-chain rules
        if: runner.os == 'Linux'
        run: |
          python3 .github/scripts/tests/test_supply_chain.py
          python3 .github/scripts/tests/test_check_actions.py
          python3 .github/scripts/check-supply-chain.py

      - name: Set up .NET from global.json
        if: hashFiles('global.json') != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Check NuGet's restore graph
        # What restore will actually do, from MSBuild's own evaluation, on every platform:
        # a condition can make a platform's restore differ from what the files appear to say.
        if: hashFiles('global.json') != ''
        run: |
          python="$(command -v python3 || command -v python)"
          "$python" .github/scripts/tests/test_restore_graph.py
          "$python" .github/scripts/check-restore-graph.py

      - name: Set up Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No shared cache: a cache another pull request could fill is a way in.
          package-manager-cache: false

      - name: Check the graph surface
        if: hashFiles('package-lock.json') != ''
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=low
          npm run typecheck
          npm test

      - name: Build and test
        run: |
          if compgen -G "*.slnx" >/dev/null || compgen -G "*.sln" >/dev/null; then
            dotnet restore --locked-mode
            # Projects outside the solution restore too, so their lock files and packages are checked.
            for project in experiments/visual-studio/*/*.csproj; do
              if [ -f "$project" ]; then dotnet restore "$project" --locked-mode; fi
            done
            # Locked mode still writes a lock file a project lacks, so none may change or appear.
            git diff --exit-code -- '*packages.lock.json'
            created="$(git ls-files --others --exclude-standard -- '*packages.lock.json')"
            if [ -n "$created" ]; then echo "::error::restore created uncommitted lock files: $created"; exit 1; fi
            if [ "$RUNNER_OS" = "Linux" ]; then python3 .github/scripts/dependency-register.py check; fi
            dotnet build --no-restore --configuration Release
            dotnet test --no-build --configuration Release
          else
            echo "No solution yet: nothing to build."
          fi

      - name: Build the Visual Studio spike
        # Visual Studio extensions build with full MSBuild on Windows; only GitHub-owned
        # actions are allowed, so MSBuild is found with vswhere rather than an action.
        if: runner.os == 'Windows' && hashFiles('experiments/visual-studio/**/*.csproj') != ''
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found.' }
          foreach ($project in Get-ChildItem experiments/visual-studio -Recurse -Filter *.csproj) {
            & $msbuild $project.FullName /restore /p:RestoreLockedMode=true /p:Configuration=Release /nologo /verbosity:minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $vsix = Get-ChildItem experiments/visual-studio -Recurse -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { throw 'The Visual Studio spike produced no VSIX.' }
          Write-Host "Built $($vsix.Name), $($vsix.Length) bytes"

  ci-passed:
    name: ci passed
    # The single required check: it stays one stable name whatever runners
    # the matrix uses, and fails unless every matrix job succeeded.
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every build to have passed
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "build matrix result: $RESULT"
          test "$RESULT" = "success"
